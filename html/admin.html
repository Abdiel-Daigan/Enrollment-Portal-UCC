<div class="role-shell">
  <aside class="role-sidebar">
    <div class="role-side-brand"><strong>Admin Portal</strong><span>Full system access</span></div>
    <button type="button" class="role-nav-toggle" onclick="window.toggleRoleNav(this)" aria-expanded="false" aria-label="Open navigation menu">&#9776;</button>
    <nav class="role-nav">
      <button class="role-nav-item" data-nav-view="students" onclick="window.setAdminView('students')">Student Management</button>
      <button class="role-nav-item" data-nav-view="staccounts" onclick="window.setAdminView('staccounts')">Student Accounts</button>
      <button class="role-nav-item" data-nav-view="users" onclick="window.setAdminView('users')">Staff Accounts</button>
    </nav>
    <div class="role-side-foot"><button onclick="window.logout()">Sign out</button></div>
  </aside>
  <div class="role-main">
    <header class="role-topbar">
      <div><h1>{{title}}</h1><div class="rt-sub">{{subtitle}}</div></div>
      <div class="rt-user"><div class="rt-who"><strong>{{userName}}</strong><span>Admin</span></div><div class="rt-avatar">{{initials}}</div></div>
    </header>
    <div class="role-content" id="adminContent"><div class="rp-empty">Loading...</div></div>
  </div>
</div>
