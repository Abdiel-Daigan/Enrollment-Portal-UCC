<div class="role-shell">
  <aside class="role-sidebar">
    <div class="role-side-brand"><strong>Admin Portal</strong><span>Full system access</span></div>
    <button type="button" class="role-nav-toggle" onclick="window.toggleRoleNav(this)" aria-expanded="false" aria-label="Open navigation menu">&#9776;</button>
    <nav class="role-nav">
      <button class="role-nav-item" data-nav-view="dashboard" onclick="window.setAdminView('dashboard')">Dashboard</button>
      <div class="role-nav-group">Records</div>
      <button class="role-nav-item" data-nav-view="students" onclick="window.setAdminView('students')">Student Management</button>
      <button class="role-nav-item" data-nav-view="staccounts" onclick="window.setAdminView('staccounts')">Student Accounts</button>
      <button class="role-nav-item" data-nav-view="users" onclick="window.setAdminView('users')">Staff Accounts</button>
      <div class="role-nav-group">Curriculum</div>
      <button class="role-nav-item" data-nav-view="programs" onclick="window.setAdminView('programs')">Programs</button>
      <button class="role-nav-item" data-nav-view="unitlimits" onclick="window.setAdminView('unitlimits')">Unit Limits</button>
      <button class="role-nav-item" data-nav-view="academicterm" onclick="window.setAdminView('academicterm')">Academic Term</button>
      <button class="role-nav-item" data-nav-view="courses" onclick="window.setAdminView('courses')">Subjects</button>
      <button class="role-nav-item" data-nav-view="presets" onclick="window.setAdminView('presets')">Preset Subjects</button>
      <button class="role-nav-item" data-nav-view="prereqs" onclick="window.setAdminView('prereqs')">Prerequisite Subjects</button>
      <div class="role-nav-group">Enrollment</div>
      <button class="role-nav-item" data-nav-view="faculty" onclick="window.setAdminView('faculty')">Student Courses</button>
      <div class="role-nav-group">Finance</div>
      <button class="role-nav-item" data-nav-view="logs" onclick="window.setAdminView('logs')">Payment Logs</button>
      <button class="role-nav-item" data-nav-view="payments" onclick="window.setAdminView('payments')">Student Payments</button>
      <button class="role-nav-item" data-nav-view="fees" onclick="window.setAdminView('fees')">Fee Settings</button>
    </nav>
    <div class="role-side-foot"><button onclick="window.logout()">Sign out</button></div>
  </aside>
  <div class="role-main">
    <header class="role-topbar">
      <div><h1>{{title}}</h1><div class="rt-sub">{{subtitle}}</div></div>
      <div class="rt-user"><div class="rt-who"><strong>{{userName}}</strong><span>Admin</span></div><div class="rt-avatar">{{initials}}</div></div>
    </header>
    <div class="role-content" id="adminContent"><div class="rp-empty">Loading...</div></div>
  </div>
</div>
